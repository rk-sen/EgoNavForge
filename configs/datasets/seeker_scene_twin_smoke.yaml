# Wiring smoke: reuse Pi3 poses, write twin inputs, do not call the VLM.
# The full sample run is configs/datasets/seeker_scene_twin.yaml.
#
#   python -m ego_nav_forge run -c configs/datasets/seeker_scene_twin_smoke.yaml --max-eps 1
workflow: ../workflows/pi3_moge_lerobot.yaml
exp_name: seeker_scene_twin_smoke
work_dir: /mnt/luozhaoyi/releases/ego_nav_forge_v1/work_dirs/seeker_scene_twin_smoke

dataset:
  root: /mnt/luozhaoyi/ABot_data_engine/threeeyes918/parsed
  episode_prefix: seeker_
  episodes:
    - seeker_19700514_035352
  stream_files:
    forward_img: bleftvid.mp4
    imu: imu.json
  pack: [forward_img]
  recon_image_key: forward_img
  image_stride: 2
  mask_path: /mnt/luozhaoyi/releases/ego_nav_forge_v1/assets/seeker_mask.png
  suite_prefix: te918_
  force_recon: false
  reuse_suite_roots:
    - /mnt/luozhaoyi/ABot_data_engine/outputs/threeeyes918_pi3_moge/suite
  lerobot_export: false
  traj_viz: false
  scene_twin:
    enabled: true
    check_only: true
    image_key: forward_img
    calib_camera: bleft
    use_pointcloud: true
    blender: /mnt/luozhaoyi/tools/blender-4.5.14-linux-x64/blender
