# Seeker sample: Pi3+MoGe, then the asset-library indoor twin.
#
#   export zhesuan_API_KEY='...'    # also accepted: KIMI_API_KEY / MOONSHOT_API_KEY
#   python -m ego_nav_forge run -c configs/datasets/seeker_scene_twin.yaml --max-eps 1
workflow: ../workflows/pi3_moge_lerobot.yaml
exp_name: seeker_scene_twin
work_dir: /mnt/luozhaoyi/releases/ego_nav_forge_v1/work_dirs/seeker_scene_twin

dataset:
  root: /mnt/luozhaoyi/ABot_data_engine/threeeyes918/parsed
  episode_prefix: seeker_
  episodes:
    - seeker_19700514_035352
  stream_files:
    forward_img: bleftvid.mp4
    left_img: brightvid.mp4
    right_img: leftvid.mp4
    imu: imu.json
  pack: [forward_img, left_img, right_img, imu]
  recon_image_key: forward_img
  image_stride: 2
  mask_path: /mnt/luozhaoyi/releases/ego_nav_forge_v1/assets/seeker_mask.png
  ann_path: /mnt/luozhaoyi/ABot_data_engine/threeeyes918/parsed/action_annotations.json
  skip_delete_token: "删"
  search_object: green ball
  suite_prefix: te918_
  force_recon: false
  checkpoint: /mnt/luozhaoyi/releases/pi3_moge_lerobot/checkpoints/Pi3X_model.safetensors
  moge_pretrained: /mnt/luozhaoyi/releases/pi3_moge_lerobot/checkpoints/moge-2-vitl/model.pt

  lerobot_export: false
  traj_viz: true

  scene_twin:
    enabled: true
    image_key: forward_img
    calib_camera: bleft
    use_pointcloud: true
    scene_type: lab
    model: kimi-k2.6
    api_base: https://ai.zj-computility.com/maas/v1
    api_key_env: zhesuan_API_KEY
    blender: /mnt/luozhaoyi/tools/blender-4.5.14-linux-x64/blender
    frames: 9
    samples: 40
